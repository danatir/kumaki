<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>くまキィ · Sign in</title>
  <style>
    @font-face { font-family:'Chihaya'; src:url('fonts/Chihaya.ttf') format('truetype'); }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; }

    body {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(150deg, #fff9f8 0%, #fdf0ef 55%, #fae6e4 100%);
      font-family:Arial, sans-serif;
      color:#3d2c28;
      position:relative;
    }

    /* ── Floating kana background ── */
    .kana-bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .kana {
      position:absolute;
      font-family:'Chihaya','Hiragino Sans','Yu Gothic',sans-serif;
      color:#d17d6e;
      opacity:0;
      animation:kana-rise var(--dur) var(--delay) ease-in infinite;
      user-select:none;
    }
    @keyframes kana-rise {
      0%   { opacity:0; transform:translateY(0) rotate(0deg); }
      12%  { opacity:var(--op); }
      80%  { opacity:var(--op); }
      100% { opacity:0; transform:translateY(-130px) rotate(var(--rot)); }
    }

    /* ── Pulsing rings ── */
    .dot-ring {
      position:fixed;
      border-radius:50%;
      border:1px solid rgba(209,125,110,.1);
      animation:pulse-ring 6s ease-in-out infinite;
      pointer-events:none;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
    }
    .dot-ring:nth-child(1) { width:420px; height:420px; animation-delay:0s; }
    .dot-ring:nth-child(2) { width:650px; height:650px; animation-delay:1.8s; }
    .dot-ring:nth-child(3) { width:880px; height:880px; animation-delay:3.6s; }
    @keyframes pulse-ring {
      0%,100% { opacity:.7; transform:translate(-50%,-50%) scale(1); }
      50%      { opacity:.15; transform:translate(-50%,-50%) scale(1.03); }
    }

    /* ── Card ── */
    .card {
      position:relative;
      z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:44px 52px 36px;
      background:#fff;
      border:1px solid #edd8d4;
      border-radius:28px;
      box-shadow:0 12px 48px rgba(167,139,137,.18), 0 2px 8px rgba(167,139,137,.1);
      max-width:360px;
      width:90vw;
      animation:card-in .5s cubic-bezier(.34,1.2,.64,1) both;
    }
    @keyframes card-in {
      from { opacity:0; transform:translateY(28px) scale(.96); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* ── Bear ── */
    .bear-wrap {
      position:relative;
      display:inline-block;
      margin-bottom:18px;
    }
    .bear-img {
      width:82px; height:82px;
      object-fit:contain;
      animation:bear-float 3.4s ease-in-out infinite;
      filter:drop-shadow(0 6px 16px rgba(209,125,110,.22));
    }
    @keyframes bear-float {
      0%,100% { transform:translateY(0) rotate(-.5deg); }
      50%      { transform:translateY(-7px) rotate(.5deg); }
    }

    /* Speech bubble — overlaps logo corner, same as home page */
    .bear-speech {
      position:absolute;
      top:-4px;
      left:calc(100% - 30px);
      background:rgba(255,255,255,.82);
      border:1.5px solid #e8d8d4;
      border-radius:12px 12px 12px 3px;
      padding:5px 11px;
      font-size:12.5px;
      white-space:nowrap;
      color:#9c7b76;
      font-family:'Chihaya','Hiragino Sans',sans-serif;
      box-shadow:0 2px 10px rgba(167,139,137,.14);
      /* reveal then float */
      animation:
        speech-reveal 1.1s ease both,
        speech-float  3.2s ease-in-out 1.1s infinite;
    }
    @keyframes speech-reveal {
      0%,50% { opacity:0; transform:scale(.7) translateY(4px); }
      100%   { opacity:1; transform:scale(1) translateY(0); }
    }
    @keyframes speech-float {
      0%,100% { transform:translateY(0) rotate(-.4deg); }
      50%      { transform:translateY(-5px) rotate(.4deg); }
    }

    /* ── Title (matches home screen 熊キィ) ── */
    .ltitle-wrap {
      margin-bottom:4px;
      animation:fade-up .4s .2s ease both;
      line-height:1.5;
    }
    .ltitle {
      font-family:'Chihaya','Noto Serif JP',serif;
      font-size:42px; color:#e0675c;
      letter-spacing:-.01em; line-height:1.2;
      ruby-align:center;
    }
    .ltitle rt {
      font-family:Arial,sans-serif;
      font-size:12px; color:#af6e6a;
      letter-spacing:.04em; font-weight:500;
    }
    .lcf { display:inline-block; }
    /* per-character float animations — same as home screen */
    @keyframes cf0{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(1px,-5px) rotate(-1.1deg)}}
    @keyframes cf1{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(1px,-2px) rotate(-2.1deg)}}
    @keyframes cf2{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-2px,-4px) rotate(-2.4deg)}}
    @keyframes cf3{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(0px,-4px) rotate(0.4deg)}}
    @keyframes cf4{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(2px,-3px) rotate(-0.8deg)}}
    .ltitle rt span{display:inline-block;}

    .tagline {
      font-size:11px; color:#af6e6a;
      letter-spacing:.06em; margin-bottom:28px;
      animation:fade-up .4s .32s ease both;
    }
    @keyframes fade-up {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Divider ── */
    .divider {
      width:100%; display:flex; align-items:center; gap:10px;
      margin-bottom:18px;
      animation:fade-up .4s .42s ease both;
      opacity:0; animation-fill-mode:forwards;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#edd8d4; }
    .divider span { font-size:10px; color:#c4a9a5; white-space:nowrap; letter-spacing:.06em; }

    /* ── Google button ── */
    .google-btn {
      display:flex; align-items:center; gap:11px;
      width:100%; padding:11px 20px;
      background:#fff; border:1.5px solid #dadce0; border-radius:10px;
      font-size:14px; font-weight:600; color:#3c4043;
      cursor:pointer; justify-content:center;
      letter-spacing:.01em; font-family:Arial, sans-serif;
      transition:background .14s, box-shadow .14s, border-color .14s;
      animation:fade-up .4s .5s ease both;
      opacity:0; animation-fill-mode:forwards;
    }
    .google-btn:hover { background:#f8f8f8; border-color:#bbb; box-shadow:0 2px 10px rgba(0,0,0,.1); }
    .google-btn:active { background:#f0f0f0; }
    .google-logo { width:20px; height:20px; flex-shrink:0; }

    /* ── GitHub button ── */
    .github-btn {
      display:flex; align-items:center; gap:11px;
      width:100%; padding:11px 20px;
      background:#24292e; border:1.5px solid #24292e; border-radius:10px;
      font-size:14px; font-weight:600; color:#fff;
      cursor:pointer; justify-content:center;
      letter-spacing:.01em; font-family:Arial, sans-serif;
      transition:background .14s, box-shadow .14s;
      animation:fade-up .4s .58s ease both;
      opacity:0; animation-fill-mode:forwards;
      margin-top:10px;
    }
    .github-btn:hover { background:#2f363d; box-shadow:0 2px 10px rgba(0,0,0,.2); }
    .github-btn:active { background:#1b2226; }
    .github-logo { width:20px; height:20px; flex-shrink:0; fill:#fff; }

    /* ── Footer ── */
    .login-note {
      font-size:10px; color:#c4a9a5; margin-top:14px; text-align:center;
      animation:fade-up .4s .58s ease both; opacity:0; animation-fill-mode:forwards;
    }
    .login-footer {
      font-size:10px; color:#d4a9a6; margin-top:28px; letter-spacing:.04em;
      animation:fade-up .4s .65s ease both; opacity:0; animation-fill-mode:forwards;
    }

    /* ── No-access screen ── */
    .no-access {
      position:relative; z-index:10;
      display:none;
      flex-direction:column; align-items:center;
      text-align:center;
    }
    .no-access.visible { display:flex; }

    /* login bubble position */
    .bear-wrap .bear-speech { left:calc(100% - 17px); }


    .na-bear-wrap .bear-speech { left:calc(100% - 24px); }

    /* Bear + bubble wrapper */
    .na-bear-wrap { position:relative; display:inline-block; margin-bottom:22px; }
    .na-bear-img {
      width:96px; height:96px; object-fit:contain;
      filter:drop-shadow(0 6px 20px rgba(209,125,110,.28));
      animation:
        na-shake 1.1s cubic-bezier(.36,.07,.19,.97) both,
        bear-float 3.4s 1.1s ease-in-out infinite;
    }
    @keyframes na-shake {
      0%,100% { transform:rotate(0) translateY(0); }
      12%     { transform:rotate(-10deg) translateY(-5px); }
      25%     { transform:rotate(10deg)  translateY(-5px); }
      37%     { transform:rotate(-8deg)  translateY(-3px); }
      50%     { transform:rotate(8deg)   translateY(-3px); }
      62%     { transform:rotate(-5deg)  translateY(-1px); }
      75%     { transform:rotate(5deg)   translateY(-1px); }
      87%     { transform:rotate(-2deg); }
    }


    .na-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(255,255,255,.72); border:1px solid #e8d8d4; border-radius:20px;
      padding:4px 13px; font-size:10px; font-weight:700; letter-spacing:.09em;
      color:#af6e6a; text-transform:uppercase; margin-bottom:12px;
      animation:fade-up .4s .6s ease both; opacity:0; animation-fill-mode:forwards;
    }
    .na-badge svg { flex-shrink:0; }

    .na-title {
      font-family:'Chihaya','Noto Serif JP',serif;
      font-size:30px; color:#e0675c; margin-bottom:8px;
      animation:fade-up .4s .72s ease both; opacity:0; animation-fill-mode:forwards;
    }
    .na-msg {
      font-size:13px; color:#9c7b76; line-height:1.7; margin-bottom:26px;
      animation:fade-up .4s .84s ease both; opacity:0; animation-fill-mode:forwards;
    }
    .na-back {
      padding:9px 26px;
      background:none; color:#af6e6a;
      border:1.5px solid #ddc8c4; border-radius:10px;
      font-size:12px; font-weight:600;
      cursor:pointer; font-family:inherit; letter-spacing:.02em;
      transition:background .14s, border-color .14s;
      animation:fade-up .4s .96s ease both; opacity:0; animation-fill-mode:forwards;
    }
    .na-back:hover { background:rgba(255,255,255,.65); border-color:#c4a9a5; }

  </style>
</head>
<body>

  <div class="dot-ring"></div>
  <div class="dot-ring"></div>
  <div class="dot-ring"></div>
  <div class="kana-bg" id="kana-bg"></div>

  <!-- ── Login card ── -->
  <div class="card" id="login-card">
    <div class="bear-wrap">
      <img class="bear-img" src="images/logo.png" alt="Kumaki">
      <div class="bear-speech">こんにちは！</div>
    </div>

    <div class="ltitle-wrap">
      <div class="ltitle notranslate" translate="no"><ruby><span class="lcf" style="animation:cf0 3.2s ease-in-out 1.4s infinite">熊</span><rt><span class="lcf" style="animation:cf1 3.5s ease-in-out 0.3s infinite">く</span><span class="lcf" style="animation:cf2 3.1s ease-in-out 1.2s infinite">ま</span></rt></ruby><span class="lcf" style="animation:cf3 4.2s ease-in-out 0.2s infinite">キ</span><span class="lcf" style="animation:cf4 3.1s ease-in-out 1.7s infinite">ィ</span></div>
    </div>
    <div class="tagline">the key to bear Japanese</div>

    <div class="divider"><span>sign in to continue</span></div>

    <button class="google-btn" onclick="loginWithGoogle()">
      <svg class="google-logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <button class="github-btn" onclick="loginWithGitHub()">
      <svg class="github-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12"/>
      </svg>
      Continue with GitHub
    </button>

    <div class="login-note">Beta access · by invitation only</div>
    <div class="login-footer">© 2025 Kumaki · All rights reserved</div>
  </div>

  <!-- ── No-access screen ── -->
  <div class="no-access" id="no-access-card">
    <div class="na-bear-wrap">
      <img class="na-bear-img" src="images/logo.png" alt="Kumaki">
      <div class="bear-speech">ごめんね！</div>
    </div>
    <div class="na-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Private Beta
    </div>
    <div class="na-title">アクセスなし</div>
    <div class="na-msg">This space is invite-only for now.<br>Ask for access to join the beta.</div>
    <button class="na-back" onclick="showLogin()">Back to sign in</button>
  </div>


  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" data-netlify-identity-url="https://kumaki.netlify.app"></script>
  <script>
    // ── Floating kana ──
    (function(){
      var chars = 'あいうえおかきくけこさしすせそたちつてとはひふへほまみむやゆよらりるれろんアイウエオカキクケコ日本語学習熊鍵';
      var bg = document.getElementById('kana-bg');
      for (var i = 0; i < 22; i++) {
        var el = document.createElement('span');
        el.className = 'kana';
        el.textContent = chars[Math.floor(Math.random() * chars.length)];
        el.style.cssText =
          'left:'      + (Math.random()*100).toFixed(1) + '%;' +
          'bottom:'    + (Math.random()*110 - 10).toFixed(1) + '%;' +
          'font-size:' + (11 + Math.random()*24).toFixed(0) + 'px;' +
          '--dur:'     + (7 + Math.random()*11).toFixed(1) + 's;' +
          '--delay:'   + (Math.random()*14).toFixed(1) + 's;' +
          '--op:'      + (0.04 + Math.random()*0.09).toFixed(3) + ';' +
          '--rot:'     + ((Math.random()-0.5)*30).toFixed(1) + 'deg;';
        bg.appendChild(el);
      }
    })();

    // ── Screen switching ──
    function showLogin() {
      document.getElementById('login-card').style.display = 'flex';
      document.getElementById('no-access-card').classList.remove('visible');
    }
    function showNoAccess() {
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('no-access-card').classList.add('visible');
    }

    // ── Check URL hash for error (OAuth redirect back with error) ──
    (function(){
      var h = window.location.hash;
      if (h && (h.includes('error=') || h.includes('error_description='))) {
        showNoAccess();
        // Clean the URL
        history.replaceState(null, '', window.location.pathname);
      }
    })();

    // Suppress the widget's own popup UI — we use our own buttons
    netlifyIdentity.on('open', function() { netlifyIdentity.close(); });

    // ── Netlify Identity events ──
    // Register listeners BEFORE calling init so we don't miss the synchronous event
    function hasAccess(user) {
      var roles = (user.app_metadata && user.app_metadata.roles) || [];
      return roles.indexOf('beta') !== -1;
    }
    netlifyIdentity.on('init', function(user) {
      if (user) {
        if (hasAccess(user)) { document.location.href = '/'; }
        else { netlifyIdentity.logout(); showNoAccess(); }
      }
    });
    netlifyIdentity.on('login', function(user) {
      if (hasAccess(user)) { document.location.href = '/?_home'; }
      else { netlifyIdentity.logout(); showNoAccess(); }
    });
    netlifyIdentity.on('error', function(err) {
      console.warn('Identity error:', err);
      showNoAccess();
    });
    // ── Direct OAuth — no widget popup ──
    function loginWithGoogle() {
      window.location.href =
        '/.netlify/identity/authorize?provider=google&redirect_to=' +
        encodeURIComponent(window.location.origin + '/login.html');
    }
    function loginWithGitHub() {
      window.location.href =
        '/.netlify/identity/authorize?provider=github&redirect_to=' +
        encodeURIComponent(window.location.origin + '/login.html');
    }
  </script>
</body>
</html>
